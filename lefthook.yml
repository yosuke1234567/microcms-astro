pre-commit:
  jobs:
    - name: format
      run: pnpm exec biome format --staged --write --no-errors-on-unmatched
      stage_fixed: true
    - name: lint
      run: pnpm exec biome lint --staged --error-on-warnings --no-errors-on-unmatched
